
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worlds — Animated Environments</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f6fa;
  color:#182033;
}

button,a{font:inherit}

.page-header{
  text-align:center;
  padding:38px 16px 24px;
}

.page-header h1{
  font-size:clamp(32px,5vw,48px);
  font-weight:900;
  letter-spacing:-2px;
}

.page-header p{
  margin-top:10px;
  color:#7c8496;
  font-size:14px;
}

.nav-gallery{
  width:min(1500px,100%);
  margin:auto;
  padding:16px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

/* NAVBAR */

.theme-nav{
  --fg:#fff;
  --accent:#a78bfa;
  --glow:#a78bfa44;

  position:relative;
  isolation:isolate;
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  min-height:96px;
  padding:12px;
  overflow:hidden;

  color:var(--fg);
  background:#10152b;
  border:1px solid var(--accent);
  border-radius:20px;
  box-shadow:0 5px 18px var(--glow);

  transition:color 1s,border-color 1s,box-shadow 1s;
}

/* SMALL THEME-COLOURED SPACESHIP POINTER */

.theme-card{
  position:relative;
  min-width:0;
}

.nav-links{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  flex:1;
  min-width:0;
  padding-bottom:15px;
}

/* Dashed trail */

.nav-pointer-trail{
  position:absolute;
  left:0;
  bottom:6px;
  width:0;
  border-top:1px dashed var(--accent);
  opacity:.9;
  pointer-events:none;
  z-index:3;
  filter:drop-shadow(0 0 2px var(--accent));
}

.nav-pointer{
  position:absolute;
  left:0;
  bottom:0;
  width:16px;
  height:14px;
  color:var(--accent);
  filter:drop-shadow(0 0 4px var(--accent));
  pointer-events:none;
  transform:translateX(-50%);
  transition:left .58s cubic-bezier(.22,.75,.25,1),
             color .8s,filter .8s;
  z-index:4;
}

.nav-pointer svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
}

.nav-pointer .ship-flame{
  transform-origin:2px 7px;
  animation:flame-flicker .7s ease-in-out infinite alternate;
}

@keyframes flame-flicker{
  from{opacity:.55;transform:scaleX(.75)}
  to{opacity:1;transform:scaleX(1.15)}
}

.nav-link.impact-target,
.theme-switch.impact-target{
  animation:button-impact .55s ease-out;
}

@keyframes button-impact{
  0%{filter:brightness(1);box-shadow:0 0 0 0 var(--accent)}
  35%{filter:brightness(1.8);box-shadow:0 0 0 5px var(--glow)}
  100%{filter:brightness(1);box-shadow:0 0 0 0 transparent}
}

/* ENVIRONMENT CROSSFADE */

.environment-layer{
  position:absolute;
  inset:0;
  z-index:-1;
  opacity:0;
  border-radius:inherit;
  pointer-events:none;
  transition:opacity 4.5s cubic-bezier(.4,0,.2,1);
}

.environment-layer.visible{opacity:1}

/* SUNSET ATMOSPHERE */

.environment-atmosphere{
  position:absolute;
  inset:0;
  z-index:0;
  opacity:0;
  pointer-events:none;
  background:linear-gradient(
    180deg,
    rgba(255,226,177,.02),
    rgba(255,157,90,.65) 42%,
    rgba(214,83,128,.45) 68%,
    rgba(55,40,120,.2)
  );
}

.theme-nav.changing .environment-atmosphere{
  animation:atmosphere 4.5s ease-in-out forwards;
}

@keyframes atmosphere{
  0%{opacity:0}
  20%{opacity:.16}
  45%{opacity:.8;filter:saturate(1.5)}
  68%{opacity:.35}
  100%{opacity:0;filter:saturate(1)}
}

/* LEFT ANIMATED SCENE */

.scene{
  position:relative;
  z-index:1;
  isolation:isolate;
  overflow:hidden;
  flex-shrink:0;
  width:76px;
  height:66px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #ffffff28;
  border-radius:14px;
  background:#ffffff10;
  transition:background 1s;
}

/* Landscape horizon */

.scene::after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:17px;
  z-index:1;
  opacity:.68;
  background:var(--accent);
  clip-path:polygon(
    0 100%,0 65%,19% 20%,36% 78%,
    58% 5%,77% 65%,100% 25%,100% 100%
  );
  transition:background 1s;
}

/* STARS */

.scene-stars{
  position:absolute;
  inset:0;
  z-index:0;
  opacity:0;
  transition:opacity 1.5s;
}

.scene-stars::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle at 17% 19%,#fff 0 1px,transparent 1.7px),
    radial-gradient(circle at 74% 22%,#fff 0 1px,transparent 1.7px),
    radial-gradient(circle at 87% 48%,#fff 0 1px,transparent 1.7px),
    radial-gradient(circle at 36% 34%,#fff 0 1px,transparent 1.7px),
    radial-gradient(circle at 59% 12%,#fff 0 1px,transparent 1.7px),
    radial-gradient(circle at 24% 53%,#fff 0 1px,transparent 1.7px);
}

.scene.night .scene-stars{opacity:1}

/* CELESTIAL BODY */

.scene-icon{
  position:relative;
  z-index:2;
  display:block;
  font-size:34px;
  line-height:1;
  transform-origin:center;
  will-change:transform,opacity;
}

.scene-icon.leaving{
  animation:planet-set 1.5s cubic-bezier(.55,0,.9,.45) forwards;
}

@keyframes planet-set{
  0%{
    opacity:1;
    transform:translateY(0) scale(1) rotate(0);
    filter:brightness(1);
  }
  45%{
    opacity:.85;
    transform:translateY(10px) scale(.92) rotate(-7deg);
    filter:brightness(1.1);
  }
  100%{
    opacity:0;
    transform:translateY(39px) scale(.65) rotate(-14deg);
    filter:brightness(.7);
  }
}

.scene-icon.rising{
  animation:planet-rise 1.85s cubic-bezier(.16,.75,.28,1) forwards;
}

@keyframes planet-rise{
  0%{
    opacity:0;
    transform:translateY(38px) scale(.65) rotate(12deg);
    filter:brightness(.65);
  }
  55%{
    opacity:1;
    transform:translateY(-4px) scale(1.08) rotate(-3deg);
    filter:brightness(1.25);
  }
  75%{
    transform:translateY(2px) scale(.97) rotate(1deg);
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1) rotate(0);
    filter:brightness(1);
  }
}

/* Theme-specific scene glow */

.scene[data-kind="sun"] .scene-icon{
  filter:drop-shadow(0 0 5px #ffca55);
}

.scene[data-kind="planet"] .scene-icon{
  filter:drop-shadow(0 0 3px #ffffff40);
}

.scene[data-kind="meteor"] .scene-icon{
  filter:drop-shadow(0 0 5px #a5f3fc);
}

/* TITLE */

.theme-info{
  position:relative;
  z-index:1;
  width:90px;
  min-width:66px;
  flex-shrink:0;
}

.theme-label{
  display:block;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.theme-caption{
  display:block;
  margin-top:5px;
  font-size:10px;
  opacity:.76;
}

/* NAV LINKS */

.nav-link{
  padding:10px;
  border-radius:12px;
  color:var(--fg);
  opacity:.9;
  text-decoration:none;
  white-space:nowrap;
  font-size:12px;
  font-weight:650;
  transition:background .3s,transform .3s,opacity .3s;
}

.nav-link:hover{
  opacity:1;
  transform:translateY(-2px);
  background:#ffffff20;
}

.nav-link.active{
  background:var(--accent);
  color:var(--active-text,var(--fg));
}

/* TOGGLE */

.theme-switch{
  position:relative;
  z-index:2;
  flex-shrink:0;
  width:94px;
  height:46px;
  padding:5px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px solid var(--accent);
  border-radius:40px;
  background:#00000025;
  cursor:pointer;
  transition:background 1s,border-color 1s;
}

.switch-icon{
  position:relative;
  z-index:1;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  user-select:none;
}

.switch-knob{
  position:absolute;
  top:4px;
  left:4px;
  z-index:2;
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid var(--accent);
  border-radius:50%;
  background:#fff;
  box-shadow:0 2px 8px #0003;
  font-size:17px;
  pointer-events:none;
  transition:left .55s cubic-bezier(.2,.8,.2,1),
             border-color .8s,color .8s;
}

.theme-switch[data-side="right"] .switch-knob{left:52px}

.theme-switch:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:3px;
}

/* RESPONSIVE */

@media(max-width:1150px){
  .nav-gallery{
    grid-template-columns:1fr;
    max-width:850px;
  }
}

@media(max-width:600px){
  .nav-gallery{padding:10px;gap:12px}

  .theme-nav{
    flex-wrap:wrap;
    min-height:125px;
    gap:9px;
    padding:10px;
  }

  .scene{width:52px;height:46px}
  .scene-icon{font-size:28px}

  .theme-info{
    width:auto;
    flex:1;
  }

  .theme-switch{width:82px;height:42px}

  .switch-icon{width:28px;height:28px;font-size:15px}

  .switch-knob{
    width:32px;
    height:32px;
    top:4px;
    left:4px;
  }

  .theme-switch[data-side="right"] .switch-knob{left:44px}

  .nav-links{
    order:3;
    flex-basis:100%;
    justify-content:space-between;
    border-top:1px solid #ffffff28;
    padding-top:6px;
    padding-bottom:15px;
  }

  .nav-link{padding:8px 9px;font-size:11px}
}

@media(prefers-reduced-motion:reduce){
  .environment-layer,.switch-knob,.scene{
    transition-duration:.01ms!important;
  }

  .theme-nav.changing .environment-atmosphere,
  .scene-icon.leaving,.scene-icon.rising{
    animation-duration:.01ms!important;
  }

  .nav-pointer{transition-duration:.01ms!important}
}
</style>
</head>

<body>

<header class="page-header">
  <p class="text-xs font-black tracking-[.25em] uppercase"
     style="color:#8b5cf6">
    INTERACTIVE DESIGN COLLECTION
  </p>
  <h1 class="mt-3">Worlds<span style="color:#8b5cf6">.</span></h1>
  <p>24 unique themes · 12 animated transformations</p>
</header>

<main>
  <section id="navGallery" class="nav-gallery"
           aria-label="Themed navigation bars"></section>
</main>

<footer class="text-center py-8 text-xs text-gray-400">
  One toggle. A whole new world.
</footer>

<script>
/* ========================================

======================================== */

const themePairs = [

],

/* 4 — OUTER PLANETS */

{

}

{

bg:"linear-gradient(120deg,#064e3b,#16a34a,#f59e0b)",

/* 12 — DAY AND NIGHT */

{

}

/* ========================================
   BUILD ALL 24 NAVIGATION BARS
======================================== */

const gallery=document.getElementById("navGallery");

themePairs.forEach((pair,pairIndex)=>{
  pair.forEach((theme,sideIndex)=>{
    const nav=document.createElement("nav");

    nav.className="theme-nav";
    nav.dataset.pair=pairIndex;
    nav.dataset.side=sideIndex;
    nav.dataset.light=String(theme.light);

    nav.innerHTML=`
      <div class="environment-layer environment-a"></div>
      <div class="environment-layer environment-b"></div>
      <div class="environment-atmosphere"></div>

      <div class="scene">
        <div class="scene-stars"></div>
        <span class="scene-icon"></span>
      </div>

      <div class="theme-info">
        <span class="theme-label"></span>
        <span class="theme-caption"></span>
      </div>

      <div class="nav-links">
        <a href="#home" class="nav-link active">Home</a>
        <a href="#login" class="nav-link">Login</a>
        <a href="#signup" class="nav-link">Signup</a>
        <a href="#contact" class="nav-link">Contact</a>

        <span class="nav-pointer-trail" aria-hidden="true"></span>

        <span class="nav-pointer" aria-hidden="true">
          <svg viewBox="0 0 24 20" fill="none"
               xmlns="http://www.w3.org/2000/svg">
            <path d="M5 10.2C7.8 4.8 13.1 2.1 20.1 2.2C20.2 8.8 17.4 14 11.9 16.7L8.2 12.9L5 10.2Z"
                  fill="currentColor"/>
            <path d="M8.3 13L4.5 15.2L5.2 10.3"
                  fill="currentColor"/>
            <circle cx="15.4" cy="6.4" r="1.8"
                    fill="#fff" fill-opacity=".9"/>
            <path class="ship-flame"
                  d="M4.8 12.2L1.4 13.5L4.1 9.9Z"
                  fill="#fb923c"/>
          </svg>
        </span>
      </div>

      <button type="button" class="theme-switch"
        aria-pressed="false" aria-label="Switch theme">
        <span class="switch-icon left-icon"></span>
        <span class="switch-icon right-icon"></span>
        <span class="switch-knob"></span>
      </button>
    `;

    nav.querySelectorAll(".nav-link").forEach(link=>{
      link.addEventListener("click",event=>{
        event.preventDefault();

        nav.querySelectorAll(".nav-link").forEach(item=>{
          item.classList.remove("active");
        });

        link.classList.add("active");
        moveThemePointer(nav,link);
      });
    });

    nav.querySelector(".theme-switch").addEventListener("click",()=>{
      const nextSide=Number(nav.dataset.side)===0?1:0;
      setTheme(nav,pair[nextSide],nextSide,true);
    });

    const card=document.createElement("div");
    card.className="theme-card";
    card.appendChild(nav);
    gallery.appendChild(card);

    setTheme(nav,theme,sideIndex,false);

    requestAnimationFrame(()=>{
      moveThemePointer(
        nav,
        nav.querySelector(".nav-link.active"),
        false
      );
    });
  });
});

/* ========================================
   MOVE SPACESHIP AND REDRAW DASHED TRAIL
======================================== */

function moveThemePointer(nav,target,animate=true){
  if(!target)return;

  const links=nav.querySelector(".nav-links");
  const pointer=nav.querySelector(".nav-pointer");
  const trail=nav.querySelector(".nav-pointer-trail");

  if(!links||!pointer||!trail)return;

  const linksRect=links.getBoundingClientRect();
  const targetRect=target.getBoundingClientRect();

  // Find the center underneath the selected button.
  const centerX=
    targetRect.left-linksRect.left+targetRect.width/2;

  // Get the last spaceship position.
  const previousX=nav._pointerX;

  // Get the current theme's accent color.
  const accent=getComputedStyle(nav)
    .getPropertyValue("--accent").trim();

  // Reset the old dashed trail.
  trail.style.transition="none";
  trail.style.width="0px";
  trail.style.left=`${centerX}px`;
  trail.style.borderColor=accent;
  trail.style.filter=`drop-shadow(0 0 2px ${accent})`;

  // Draw a new trail from the previous position to the new position.
  if(
    animate&&
    Number.isFinite(previousX)&&
    Math.abs(centerX-previousX)>1
  ){
    trail.style.left=`${Math.min(previousX,centerX)}px`;
    trail.style.width=`${Math.abs(centerX-previousX)}px`;
  }

  // Move the spaceship smoothly.
  if(!animate)pointer.style.transition="none";

  pointer.style.left=`${centerX}px`;
  pointer.style.color=accent;
  pointer.style.filter=`drop-shadow(0 0 4px ${accent})`;

  // Remember this position for the next click.
  nav._pointerX=centerX;

  if(!animate){
    pointer.getBoundingClientRect();
    pointer.style.removeProperty("transition");
  }
}

/* ========================================
   ANIMATE THE LEFT-HAND PLANET / OBJECT
======================================== */

function animateSceneChange(nav,theme){
  const icon=nav.querySelector(".scene-icon");

  // Cancel previous animations if toggled again.
  clearTimeout(nav._sceneTimer);
  clearTimeout(nav._riseTimer);

  icon.classList.remove("leaving","rising");
  void icon.offsetWidth;

  // The old object sinks beneath the horizon.
  icon.classList.add("leaving");

  nav._sceneTimer=setTimeout(()=>{
    icon.textContent=theme.scene;
    icon.dataset.kind=theme.kind;

    icon.classList.remove("leaving");
    void icon.offsetWidth;

    // The new object rises into view.
    icon.classList.add("rising");

    nav._riseTimer=setTimeout(()=>{
      icon.classList.remove("rising");
      nav._riseTimer=null;
    },1900);

    nav._sceneTimer=null;
  },1500);
}

/* ========================================
   CHANGE ENVIRONMENT AND NAVBAR THEME
======================================== */

function setTheme(nav,theme,side,animate=true){
  const pair=themePairs[Number(nav.dataset.pair)];
  const toggle=nav.querySelector(".theme-switch");
  const scene=nav.querySelector(".scene");
  const icon=nav.querySelector(".scene-icon");

  const layerA=nav.querySelector(".environment-a");
  const layerB=nav.querySelector(".environment-b");

  const initialized=nav.dataset.initialized==="true";

  nav.dataset.side=side;
  nav.dataset.light=String(theme.light);

  nav.style.setProperty("--fg",theme.fg);
  nav.style.setProperty("--accent",theme.accent);
  nav.style.setProperty("--glow",theme.glow);

  // Apply theme colors to the spaceship's containing card.
  nav.parentElement.style.setProperty("--accent",theme.accent);
  nav.parentElement.style.setProperty("--glow",theme.glow);

  if(!initialized){
    layerA.style.background=theme.bg;
    layerB.style.background=theme.bg;

    layerA.classList.add("visible");
    layerB.classList.remove("visible");

    nav.dataset.activeLayer="a";
    nav.dataset.initialized="true";

    icon.textContent=theme.scene;
    icon.dataset.kind=theme.kind;
  }

  else if(animate){
    const oldLayer=
      nav.dataset.activeLayer==="a"?layerA:layerB;

    const newLayer=
      nav.dataset.activeLayer==="a"?layerB:layerA;

    newLayer.style.background=theme.bg;
    newLayer.classList.remove("visible");

    nav.classList.remove("changing");
    clearTimeout(nav._environmentTimer);

    void nav.offsetWidth;
    nav.classList.add("changing");

    requestAnimationFrame(()=>{
      newLayer.classList.add("visible");
      oldLayer.classList.remove("visible");
    });

    nav.dataset.activeLayer=
      newLayer===layerA?"a":"b";

    nav._environmentTimer=setTimeout(()=>{
      nav.classList.remove("changing");
      nav._environmentTimer=null;
    },4500);

    animateSceneChange(nav,theme);
  }

  // Nighttime themes display stars.
  const nightThemes=[
    "Moon","Eclipse","Meteor","Galaxy",
    "Nebula","Midnight","Neptune","Pluto"
  ];

  scene.classList.toggle(
    "night",
    nightThemes.includes(theme.name)
  );

  if(!animate){
    icon.dataset.kind=theme.kind;
  }

  // Update the theme title and caption.
  nav.querySelector(".theme-label").textContent=theme.name;
  nav.querySelector(".theme-caption").textContent=theme.caption;

  // Update toggle position and icons.
  toggle.dataset.side=side===0?"left":"right";

  toggle.querySelector(".left-icon").textContent=pair[0].icon;
  toggle.querySelector(".right-icon").textContent=pair[1].icon;

  toggle.setAttribute("aria-pressed",String(side===1));

  toggle.setAttribute(
    "aria-label",
    `Switch ${theme.name} to ${pair[side===0?1:0].name}`
  );

  const knob=toggle.querySelector(".switch-knob");
  knob.textContent=theme.icon;
  knob.style.color=theme.accent;
  knob.style.borderColor=theme.accent;

  // Keep the spaceship under the currently active link.
  const activeLink=nav.querySelector(".nav-link.active");

  if(activeLink){
    requestAnimationFrame(()=>{
      moveThemePointer(nav,activeLink,false);
    });
  }
}

/* Keep the spaceship aligned when the window changes size. */
window.addEventListener("resize",()=>{
  document.querySelectorAll(".theme-nav").forEach(nav=>{
    const activeLink=nav.querySelector(".nav-link.active");
    if(activeLink){
      moveThemePointer(nav,activeLink,false);
    }
  });
});
</script>
