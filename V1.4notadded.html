<style>
* {
    box-sizing: border-box;
}

:root {
    --transition-time: 4.5s;
}

body {
    margin: 0;
    min-height: 100vh;
    color: #f8fafc;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(ellipse at 50% 0%, #172554 0%, transparent 45%),
        #030712;
}

.page-header {
    text-align: center;
    padding: 28px 16px 22px;
}

.page-header h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    letter-spacing: -2px;
    margin: 0;
    background: linear-gradient(90deg, #fff, #93c5fd, #c4b5fd);
    color: transparent;
    background-clip: text;
}

.page-header p {
    color: #94a3b8;
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: 8px;
}

.gallery {
    width: min(1500px, 96%);
    margin: auto;
    padding-bottom: 40px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

/* NAVBAR CARD */

.theme-nav {
    --accent: #60a5fa;
    --background: #07152c;
    --secondary: #122c50;
    --planet-size: 100px;

    position: relative;
    isolation: isolate;
    min-height: 120px;
    border: 1px solid var(--accent);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 12px 14px;
    gap: 12px;
    background: var(--background);
    box-shadow:
        0 0 15px color-mix(in srgb, var(--accent) 15%, transparent),
        inset 0 0 25px #0005;
    transition:
        border-color var(--transition-time) ease,
        box-shadow var(--transition-time) ease;
}

/* TWO ENVIRONMENT LAYERS CROSSFADE */

.environment-layer {
    position: absolute;
    inset: 0;
    z-index: -3;
    opacity: 1;
    transition: opacity var(--transition-time) ease;
    background:
        radial-gradient(ellipse at 50% 130%, var(--secondary), transparent 65%),
        linear-gradient(110deg, var(--background), #020617);
}

.environment-layer.next {
    opacity: 0;
}

.environment-layer::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .8;
    background:
        radial-gradient(circle at 78% 20%, #ffffffb0 0 1px, transparent 2px),
        radial-gradient(circle at 65% 36%, #ffffff80 0 1px, transparent 2px),
        radial-gradient(circle at 90% 65%, #ffffffa0 0 1px, transparent 2px),
        radial-gradient(circle at 42% 12%, #ffffff70 0 1px, transparent 2px),
        radial-gradient(circle at 56% 74%, #ffffff70 0 1px, transparent 2px);
}

/* COLORED ATMOSPHERE */

.atmosphere {
    position: absolute;
    z-index: -2;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            0deg,
            var(--secondary) 0%,
            transparent 50%
        ),
        linear-gradient(
            90deg,
            var(--background) 0%,
            transparent 55%,
            var(--background) 100%
        );
    opacity: .8;
    transition: background var(--transition-time) ease;
}

/* PLANET AREA */

.planet-stage {
    position: absolute;
    left: 70px;
    top: 50%;
    width: 130px;
    height: 130px;
    transform: translateY(-50%);
    z-index: -1;
    pointer-events: none;
    display: grid;
    place-items: center;
}

.planet {
    position: relative;
    width: var(--planet-size);
    height: var(--planet-size);
    flex-shrink: 0;
    border-radius: 50%;
    overflow: visible;

    background:
        radial-gradient(
            circle at 28% 23%,
            #ffffff 0%,
            #ffffffc9 2%,
            #ffffff55 8%,
            transparent 23%
        ),
        radial-gradient(
            circle at 35% 30%,
            var(--planet-light) 0%,
            var(--planet-mid) 40%,
            var(--planet-dark) 75%,
            #020617 100%
        );

    box-shadow:
        inset -13px -8px 22px #000b,
        inset 4px 3px 10px #ffffff45,
        0 0 16px var(--planet-glow),
        0 0 34px color-mix(in srgb, var(--planet-glow) 60%, transparent);

    transition:
        background var(--transition-time) ease,
        box-shadow var(--transition-time) ease;
}

/* SURFACE TEXTURE */

.planet::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;

    background:
        radial-gradient(ellipse at 25% 45%, #ffffff25 0 3%, transparent 15%),
        radial-gradient(ellipse at 62% 28%, #0005 0 5%, transparent 20%),
        radial-gradient(ellipse at 43% 68%, #ffffff20 0 5%, transparent 17%),
        radial-gradient(ellipse at 75% 70%, #0006 0 7%, transparent 18%),
        repeating-linear-gradient(
            155deg,
            transparent 0 8px,
            #ffffff09 9px 10px,
            transparent 12px 18px
        );

    opacity: .9;
    mix-blend-mode: soft-light;
}

/* ATMOSPHERIC EDGE */

.planet::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--planet-glow) 65%, transparent);
    box-shadow: inset 0 0 7px var(--planet-glow);
    opacity: .7;
}

/* SATURN-LIKE RINGS */

.planet.has-rings {
    overflow: visible;
    z-index: 1;
}

.planet.has-rings .rings {
    position: absolute;
    z-index: -1;
    width: 155%;
    height: 43%;
    left: -27%;
    top: 29%;
    border-radius: 50%;
    transform: rotate(-23deg);
    border: 8px solid #d9c39b;
    box-shadow:
        0 0 3px #fff7,
        inset 0 0 5px #39250d;
    background: transparent;
}

.planet.has-rings .rings::before {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 3px solid #fff3d166;
}

.planet.has-rings .rings::after {
    content: "";
    position: absolute;
    inset: 3px 0;
    border-radius: 50%;
    border-top: 3px solid #fff7;
    border-bottom: 3px solid #483821;
}

/* PLANET COLORS */

.planet-mercury {
    --planet-light: #d8d4cf;
    --planet-mid: #888b92;
    --planet-dark: #343945;
    --planet-glow: #b8c5dc;

    --planet-mid: #475569;
    --planet-dark: #0f172a;
    --planet-glow: #818cf8;
}

/* PLANET TRANSITIONS */

.planet.leaving {
    animation: planet-set 1.45s ease-in forwards;
}

.planet.rising {
    animation: planet-rise 1.8s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes planet-set {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(100px) scale(.65);
        opacity: 0;
    }
}

@keyframes planet-rise {
    0% {
        transform: translateY(100px) scale(.65);
        opacity: 0;
    }
    100% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
}

/* LEFT TITLE */

.theme-info {
    position: relative;
    z-index: 2;
    flex: 0 0 100px;
    min-width: 0;
    text-shadow: 0 2px 5px #000;
}

.theme-info h2 {
    font-size: 15px;
    line-height: 1.2;
    font-weight: 700;
    margin: 0 0 5px;
}

.theme-info p {
    color: #dbeafe;
    font-size: 10px;
    line-height: 1.2;
    margin: 0;
}

/* NAVIGATION LINKS */

.nav-links {
    position: relative;
    z-index: 2;
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
}

.nav-links a {
    padding: 9px 8px;
    border-radius: 8px;
    color: #f8fafc;
    font-size: 11px;
    text-decoration: none;
    white-space: nowrap;
    border: 1px solid transparent;
    text-shadow: 0 1px 4px #000;
    transition:
        background .25s ease,
        border-color .25s ease,
        transform .25s ease;
}

.nav-links a:hover {
    transform: translateY(-2px);
    background: color-mix(in srgb, var(--accent) 30%, transparent);
    border-color: color-mix(in srgb, var(--accent) 70%, transparent);
}

.nav-links a.active {
    background: color-mix(in srgb, var(--accent) 25%, #020617);
    border-color: color-mix(in srgb, var(--accent) 55%, transparent);
}

/* THEME SWITCH */

.theme-switch {
    position: relative;
    z-index: 3;
    flex: 0 0 86px;
    height: 43px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 4px;
    border-radius: 30px;
    background: #020617e8;
    border: 1px solid color-mix(in srgb, var(--accent) 65%, #fff);
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 35%, transparent);
}

.theme-switch button {
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid #ffffff22;
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    background: #111827;
    transition: transform .3s ease, box-shadow .3s ease;
}

.theme-switch button:hover {
    transform: scale(1.1);
}

.theme-switch button.selected {
    box-shadow: 0 0 12px var(--accent);
    border-color: #ffffffb0;
}

/* SMALL REALISTIC PLANETS INSIDE SWITCH */

.mini-planet {
    position: relative;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    overflow: visible;
    background:
        radial-gradient(circle at 30% 25%, #fff 0%, #ffffff90 5%, transparent 20%),
        radial-gradient(circle at 35% 35%, var(--planet-light), var(--planet-mid) 55%, var(--planet-dark) 100%);
    box-shadow: inset -4px -3px 6px #000c, 0 0 5px var(--planet-glow);
}

.mini-planet::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
        radial-gradient(ellipse at 65% 30%, #0004 0 14%, transparent 16%),
        radial-gradient(ellipse at 40% 65%, #fff3 0 12%, transparent 15%);
}

.mini-planet.has-rings::after {
    content: "";
    position: absolute;
    width: 34px;
    height: 10px;
    border: 2px solid #d8c59b;
    border-radius: 50%;
    top: 7px;
    left: -6px;
    transform: rotate(-25deg);
}

/* SUNSET / TRANSITION GLOW */

.sunset-glow {
    position: absolute;
    z-index: -1;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background:
        radial-gradient(ellipse at 55% 110%, #fb923c88, transparent 60%),
        linear-gradient(0deg, #f9731630, transparent 70%);
    transition: opacity 1.5s ease;
}

.theme-nav.changing .sunset-glow {
    opacity: 1;
}

/* RESPONSIVE */

@media (max-width: 1000px) {
    .gallery {
        grid-template-columns: 1fr;
        width: min(760px, 96%);
    }

    .theme-nav {
        min-height: 116px;
    }
}

@media (max-width: 520px) {
    .gallery {
        width: 94%;
        gap: 12px;
    }

    .theme-nav {
        padding: 10px;
        gap: 5px;
        min-height: 110px;
    }

    .theme-info {
        flex-basis: 70px;
    }

    .theme-info h2 {
        font-size: 12px;
    }

    .theme-info p {
        font-size: 9px;
    }

    .nav-links {
        gap: 0;
    }

    .nav-links a {
        padding: 7px 4px;
        font-size: 9px;
    }

    .theme-switch {
        flex-basis: 65px;
        height: 36px;
        padding: 3px;
    }

    .theme-switch button {
        width: 26px;
        height: 26px;
    }

    .mini-planet {
        width: 19px;
        height: 19px;
    }

    .mini-planet.has-rings::after {
        width: 27px;
        height: 8px;
        top: 5px;
        left: -5px;
    }

    .planet-stage {
        left: 28px;
        opacity: .75;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

            accent: "#bfdbfe",
            size: 100
        },
        {
            name: "Tropical",
            subtitle: "Island Paradise",
            className: "tropical",
            background: "#063b36",
            secondary: "#0d9488",
            accent: "#5eead4",
            size: 100
        }
    ],
    [
        {
            name: "Daylight",
            subtitle: "Bright Open Skies",
            className: "daylight",
            background: "#16385d",
            secondary: "#facc15",
            accent: "#fde047",
            size: 100
        },
        {
            name: "Midnight",
            subtitle: "Stars After Dark",
            className: "midnight",
            background: "#020617",
            secondary: "#312e81",
            accent: "#818cf8",
            size: 100
        }
    ]
];

const gallery = document.getElementById("gallery");

/* BUILD PLANETS */

function makePlanet(theme, extraClass = "") {
    const planet = document.createElement("div");
    planet.className = `planet planet-${theme.className} ${extraClass}`;

    if (theme.rings) {
        planet.classList.add("has-rings");

        const rings = document.createElement("span");
        rings.className = "rings";
        planet.appendChild(rings);
    }

    return planet;
}

/* SMALL SWITCH ICON */

function makeMiniPlanet(theme) {
    const planet = document.createElement("span");
    planet.className = `mini-planet planet-${theme.className}`;

    if (theme.rings) {
        planet.classList.add("has-rings");
    }

    return planet;
}

/* CREATE EACH NAVBAR */

function createNavbar(pair, initialIndex) {
    let currentIndex = initialIndex;

    const nav = document.createElement("section");
    nav.className = "theme-nav";

    const layerA = document.createElement("div");
    layerA.className = "environment-layer";

    const layerB = document.createElement("div");
    layerB.className = "environment-layer next";

    const atmosphere = document.createElement("div");
    atmosphere.className = "atmosphere";

    const sunset = document.createElement("div");
    sunset.className = "sunset-glow";

    const stage = document.createElement("div");
    stage.className = "planet-stage";

    const info = document.createElement("div");
    info.className = "theme-info";

    const heading = document.createElement("h2");
    const subtitle = document.createElement("p");

    info.append(heading, subtitle);

    const links = document.createElement("nav");
    links.className = "nav-links";
    links.setAttribute("aria-label", "Example navigation");

    ["Home", "Login", "Signup", "Contact"].forEach((label, index) => {
        const link = document.createElement("a");
        link.href = "#";
        link.textContent = label;

        if (index === 0) {
            link.classList.add("active");
        }

        link.addEventListener("click", event => {
            event.preventDefault();

            links.querySelectorAll("a").forEach(item => {
                item.classList.remove("active");
            });

            link.classList.add("active");
        });

        links.appendChild(link);
    });

    const switcher = document.createElement("div");
    switcher.className = "theme-switch";
    switcher.setAttribute("aria-label", "Change theme");

    const buttons = pair.map((theme, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.title = `Switch to ${theme.name}`;
        button.setAttribute("aria-label", `Switch to ${theme.name}`);
        button.appendChild(makeMiniPlanet(theme));

        button.addEventListener("click", () => {
            changeTheme(index);
        });

        switcher.appendChild(button);
        return button;
    });

    nav.append(
        layerA,
        layerB,
        atmosphere,
        sunset,
        stage,
        info,
        links,
        switcher
    );

    function applyTheme(theme, animate = false) {
        nav.style.setProperty("--background", theme.background);
        nav.style.setProperty("--secondary", theme.secondary);
        nav.style.setProperty("--accent", theme.accent);
        nav.style.setProperty("--planet-size", `${theme.size}px`);

        nav.style.borderColor = theme.accent;

        heading.textContent = theme.name;
        subtitle.textContent = theme.subtitle;

        buttons.forEach((button, index) => {
            button.classList.toggle("selected", index === currentIndex);
            button.setAttribute(
                "aria-pressed",
                String(index === currentIndex)
            );
        });

        const background = `
            radial-gradient(
                ellipse at 30% 100%,
                ${theme.secondary}88 0%,
                transparent 58%
            ),
            radial-gradient(
                ellipse at 75% 10%,
                ${theme.accent}22 0%,
                transparent 55%
            ),
            linear-gradient(
                115deg,
                ${theme.background},
                #020617 95%
            )
        `;

        if (animate) {
            layerB.style.background = background;
            layerB.classList.remove("next");

            layerA.classList.add("next");

            window.setTimeout(() => {
                layerA.style.background = background;
                layerA.classList.remove("next");
                layerB.classList.add("next");
            }, 4500);
        } else {
            layerA.style.background = background;
            layerB.style.background = background;
        }

        atmosphere.style.background = `
            linear-gradient(
                0deg,
                ${theme.secondary}66 0%,
                transparent 70%
            ),
            linear-gradient(
                90deg,
                ${theme.background} 0%,
                transparent 55%,
                ${theme.background} 100%
            )
        `;
    }

    function changeTheme(nextIndex) {
        if (nextIndex === currentIndex) return;

        const oldTheme = pair[currentIndex];
        const nextTheme = pair[nextIndex];

        nav.classList.add("changing");

        const oldPlanet = stage.querySelector(".planet");

        if (oldPlanet) {
            oldPlanet.classList.remove("rising");
            oldPlanet.classList.add("leaving");
        }

        currentIndex = nextIndex;

        /* Update the environment and navbar colors. */
        applyTheme(nextTheme, true);

        /* Create the incoming planet below the horizon. */
        const newPlanet = makePlanet(nextTheme, "rising");

        newPlanet.style.transform = "translateY(100px) scale(.65)";
        newPlanet.style.opacity = "0";

        stage.appendChild(newPlanet);

        requestAnimationFrame(() => {
            newPlanet.style.opacity = "";
            newPlanet.style.transform = "";
        });

        window.setTimeout(() => {
            if (oldPlanet && oldPlanet.parentNode) {
                oldPlanet.remove();
            }

            newPlanet.classList.remove("rising");
            nav.classList.remove("changing");
        }, 1900);
    }

    stage.appendChild(makePlanet(pair[currentIndex]));
    applyTheme(pair[currentIndex]);

    return nav;
}

/* DISPLAY 12 PAIRS / 24 NAVBARS */

themePairs.forEach(pair => {
    gallery.appendChild(createNavbar(pair, 0));
    gallery.appendChild(createNavbar(pair, 1));
});
</script>
