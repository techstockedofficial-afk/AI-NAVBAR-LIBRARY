
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worlds — Animated Theme Navigation</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  color: #182033;
  background: #f5f6fa;
}

button, a {
  font: inherit;
}

.page-header {
  text-align: center;
  padding: 42px 20px 28px;
}

.page-header h1 {
  font-size: clamp(30px, 5vw, 48px);
  font-weight: 900;
  letter-spacing: -1.8px;
}

.page-header p {
  margin-top: 10px;
  color: #7c8496;
  font-size: 14px;
}

.nav-gallery {
  width: min(1500px, 100%);
  margin: auto;
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

/* NAVBAR */

.theme-nav {
  --fg: #fff;
  --accent: #d946ef;
  --glow: #d946ef44;

  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
  min-height: 92px;
  padding: 12px 15px;
  overflow: hidden;

  color: var(--fg);
  background: transparent;
  border: 1px solid var(--accent);
  border-radius: 22px;
  box-shadow: 0 5px 18px var(--glow);

  transition:
    color 1s ease,
    border-color 1s ease,
    box-shadow 1s ease;
}

/* CROSSFADE BACKGROUND LAYERS */

.environment-layer {
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  pointer-events: none;

  opacity: 0;
  background-size: 200% 200%;
  background-position: center;

  transition:
    opacity 4.5s cubic-bezier(.4, 0, .2, 1);
}

.environment-layer.visible {
  opacity: 1;
}

/* TEMPORARY SUNSET / ATMOSPHERE */

.environment-atmosphere {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  border-radius: inherit;

  opacity: 0;
  background:
    linear-gradient(
      180deg,
      rgba(255, 220, 180, 0.03) 0%,
      rgba(255, 161, 108, 0.58) 42%,
      rgba(204, 83, 119, 0.48) 65%,
      rgba(74, 46, 117, 0.22) 100%
    );
}

.theme-nav.changing .environment-atmosphere {
  animation: atmosphere-change 4.5s ease-in-out forwards;
}

@keyframes atmosphere-change {
  0% {
    opacity: 0;
    filter: saturate(1);
  }

  22% {
    opacity: .18;
  }

  45% {
    opacity: .82;
    filter: saturate(1.5);
  }

  65% {
    opacity: .48;
  }

  100% {
    opacity: 0;
    filter: saturate(1);
  }
}

/* LANDSCAPE ICON */

.scene {
  position: relative;
  z-index: 1;
  width: 75px;
  min-width: 75px;
  height: 64px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 35px;
  border-radius: 15px;
  overflow: hidden;

  background: rgba(255,255,255,.08);
  transition:
    background 1s ease,
    transform 1s ease,
    filter 1s ease;
}

.scene::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 12px;
  opacity: .6;
  background: var(--accent);
  clip-path: polygon(
    0 100%, 0 70%, 25% 15%, 42% 75%,
    65% 0, 82% 60%, 100% 20%, 100% 100%
  );
  transition: background 1s ease;
}

.scene-icon {
  position: relative;
  z-index: 1;
  transition: transform .7s ease, filter 1s ease;
}

.theme-nav.changing .scene {
  animation: landscape-glow 4.5s ease-in-out;
}

.theme-nav.changing .scene-icon {
  animation: icon-change 4.5s ease-in-out;
}

@keyframes landscape-glow {
  0%, 100% {
    filter: brightness(1);
    transform: scale(1);
  }

  45% {
    filter: brightness(1.35);
    transform: scale(1.04);
  }
}

@keyframes icon-change {
  0%, 100% {
    transform: translateY(0) rotate(0deg);
  }

  45% {
    transform: translateY(-4px) rotate(-8deg);
  }
}

/* THEME NAME */

.theme-info {
  position: relative;
  z-index: 1;
  width: 92px;
  min-width: 70px;
  flex-shrink: 0;
}

.theme-label {
  display: block;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  transition: color 1s ease;
}

.theme-caption {
  display: block;
  margin-top: 5px;
  color: var(--fg);
  opacity: .72;
  font-size: 10px;
}

/* NAVIGATION LINKS */

.nav-links {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  flex: 1;
  min-width: 0;
}

.nav-link {
  text-decoration: none;
  white-space: nowrap;
  color: var(--fg);
  opacity: .9;
  padding: 10px 12px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 650;

  transition:
    background 1s ease,
    color 1s ease,
    opacity .25s ease,
    transform .25s ease;
}

.nav-link:hover {
  opacity: 1;
  transform: translateY(-1px);
  background: rgba(255,255,255,.14);
}

.nav-link.active {
  color: var(--active-text, var(--fg));
  background: var(--accent);
  box-shadow: 0 3px 12px var(--glow);
}

/* TOGGLE */

.theme-switch {
  position: relative;
  z-index: 2;
  flex-shrink: 0;

  width: 100px;
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px;

  border: 1px solid var(--accent);
  border-radius: 40px;
  background: rgba(0,0,0,.18);
  cursor: pointer;

  transition:
    background 1s ease,
    border-color 1s ease;
}

.switch-icon {
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 18px;
  z-index: 1;
  user-select: none;
}

.switch-knob {
  position: absolute;
  top: 5px;
  left: 5px;

  width: 36px;
  height: 36px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--accent);
  box-shadow: 0 2px 8px #0003;

  font-size: 16px;
  pointer-events: none;
  z-index: 2;

  transition:
    left .55s cubic-bezier(.2,.8,.2,1),
    background .8s ease,
    border-color 1s ease,
    color .8s ease;
}

.theme-switch[data-side="right"] .switch-knob {
  left: 57px;
}

.theme-switch:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}

.theme-nav[data-light="true"] .theme-switch {
  background: rgba(255,255,255,.5);
}

.theme-nav[data-light="true"] .nav-link:hover {
  background: rgba(0,0,0,.07);
}

/* RESPONSIVE */

@media (max-width: 1150px) {
  .nav-gallery {
    grid-template-columns: 1fr;
    max-width: 850px;
  }

  .theme-info {
    width: 100px;
  }
}

@media (max-width: 600px) {
  .nav-gallery {
    padding: 10px;
    gap: 12px;
  }

  .theme-nav {
    min-height: 125px;
    flex-wrap: wrap;
    gap: 9px;
    padding: 11px;
    border-radius: 18px;
  }

  .scene {
    width: 52px;
    min-width: 52px;
    height: 45px;
    font-size: 27px;
  }

  .theme-info {
    width: auto;
    flex: 1;
  }

  .theme-label {
    font-size: 10px;
  }

  .theme-caption {
    font-size: 9px;
  }

  .theme-switch {
    width: 84px;
    height: 42px;
  }

  .switch-icon {
    width: 30px;
    height: 30px;
    font-size: 16px;
  }

  .switch-knob {
    width: 32px;
    height: 32px;
    top: 4px;
    left: 4px;
  }

  .theme-switch[data-side="right"] .switch-knob {
    left: 46px;
  }

  .nav-links {
    order: 3;
    flex-basis: 100%;
    justify-content: space-between;
    border-top: 1px solid rgba(128,128,128,.2);
    padding-top: 6px;
  }

  .nav-link {
    padding: 8px 9px;
    font-size: 11px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .environment-layer,
  .switch-knob,
  .scene,
  .scene-icon,
  .nav-link {
    transition-duration: .01ms !important;
  }

  .theme-nav.changing .environment-atmosphere,
  .theme-nav.changing .scene,
  .theme-nav.changing .scene-icon {
    animation-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<header class="page-header">
  <p class="text-xs font-black tracking-[.25em] uppercase"
     style="color:#8b5cf6">
    INTERACTIVE DESIGN COLLECTION
  </p>

  <h1 class="mt-3">
    Worlds<span style="color:#8b5cf6">.</span>
  </h1>

  <p>24 themed navigation bars · 12 animated theme pairs</p>
</header>

<main>
  <section id="navGallery"
           class="nav-gallery"
           aria-label="Themed navigation bars">
  </section>
</main>

<footer class="text-center py-8 text-xs text-gray-400">
  Choose a theme. Change your world.
</footer>

<script>
/* =========================================
   12 THEME PAIRS — 24 THEMES
========================================= */

const themePairs = [
  [
    {
      name: "Mars", icon: "🔴", scene: "🔴",
      bg: "linear-gradient(110deg,#390816,#9f1239,#390816)",
      fg: "#fff1f2", accent: "#fb7185", glow: "#fb718555",
      light: false, caption: "Red planet"
    },
    {
      name: "Venus", icon: "🪐", scene: "🪐",
      bg: "linear-gradient(110deg,#fff0f2,#f9a8bd,#ffe4e8)",
      fg: "#782b48", accent: "#f47291", glow: "#f4729140",
      light: true, caption: "Pink atmosphere"
    }
  ],
  [
    {
      name: "Sun", icon: "☀️", scene: "☀️",
      bg: "linear-gradient(110deg,#ffb000,#f97316,#9a3412)",
      fg: "#fffbea", accent: "#facc15", glow: "#facc1550",
      light: false, caption: "Golden light"
    },
    {
      name: "Moon", icon: "🌙", scene: "🌙",
      bg: "linear-gradient(110deg,#071331,#123a85,#06122e)",
      fg: "#eff6ff", accent: "#60a5fa", glow: "#60a5fa55",
      light: false, caption: "Moonlit sky"
    }
  ],
  [
    {
      name: "Day", icon: "☀️", scene: "🌤️",
      bg: "linear-gradient(110deg,#fff0bd,#bae6fd,#7dd3fc)",
      fg: "#173b66", accent: "#fde68a", glow: "#facc1530",
      light: true, caption: "Bright and clear"
    },
    {
      name: "Night", icon: "🌙", scene: "🌙",
      bg: "linear-gradient(110deg,#071a49,#123b8c,#101b46)",
      fg: "#eff6ff", accent: "#3b82f6", glow: "#3b82f655",
      light: false, caption: "Midnight blue"
    }
  ],
  [
    {
      name: "Summer", icon: "☀️", scene: "🌴",
      bg: "linear-gradient(110deg,#ff9d16,#f04438,#a71937)",
      fg: "#fff7ed", accent: "#fb923c", glow: "#fb923c55",
      light: false, caption: "Tropical heat"
    },
    {
      name: "Winter", icon: "❄️", scene: "🏔️",
      bg: "linear-gradient(110deg,#e0f2fe,#bae6fd,#dbeafe)",
      fg: "#16416f", accent: "#7dd3fc", glow: "#38bdf855",
      light: true, caption: "Frosty blue"
    }
  ],
  [
    {
      name: "Forest", icon: "🌲", scene: "🌲",
      bg: "linear-gradient(110deg,#032e26,#047857,#064e3b)",
      fg: "#ecfdf5", accent: "#34d399", glow: "#34d39945",
      light: false, caption: "Deep green"
    },
    {
      name: "Desert", icon: "🌵", scene: "🌵",
      bg: "linear-gradient(110deg,#ffedb7,#fb923c,#c65c23)",
      fg: "#66351c", accent: "#fbbf24", glow: "#fbbf2455",
      light: true, caption: "Warm sand"
    }
  ],
  [
    {
      name: "Ocean", icon: "🌊", scene: "🌊",
      bg: "linear-gradient(110deg,#063b9b,#0284c7,#06b6d4)",
      fg: "#effaff", accent: "#38bdf8", glow: "#38bdf855",
      light: false, caption: "Ocean blue"
    },
    {
      name: "Mountain", icon: "🏔️", scene: "🏔️",
      bg: "linear-gradient(110deg,#f0f9ff,#bfdbfe,#e0e7ff)",
      fg: "#173967", accent: "#93c5fd", glow: "#60a5fa40",
      light: true, caption: "Alpine peaks"
    }
  ],
  [
    {
      name: "City", icon: "🏙️", scene: "🏙️",
      bg: "linear-gradient(110deg,#28005e,#6d28d9,#4c1d95)",
      fg: "#f5f3ff", accent: "#c084fc", glow: "#a855f755",
      light: false, caption: "Neon skyline"
    },
    {
      name: "Village", icon: "🏡", scene: "🏡",
      bg: "linear-gradient(110deg,#fff0c9,#fdba74,#fbbf77)",
      fg: "#65391f", accent: "#fb923c", glow: "#fb923c45",
      light: true, caption: "Quiet countryside"
    }
  ],
  [
    {
      name: "Retro", icon: "🌅", scene: "🌅",
      bg: "linear-gradient(110deg,#4a044e,#be185d,#f43f5e)",
      fg: "#fff1f7", accent: "#f472b6", glow: "#ec489955",
      light: false, caption: "Retro sunset"
    },
    {
      name: "Futuristic", icon: "🌆", scene: "🌆",
      bg: "linear-gradient(110deg,#07143f,#123e91,#172554)",
      fg: "#e0f2fe", accent: "#22d3ee", glow: "#22d3ee55",
      light: false, caption: "Neon future"
    }
  ],
  [
    {
      name: "Galaxy", icon: "🌀", scene: "🌀",
      bg: "linear-gradient(110deg,#10072f,#32106c,#180b46)",
      fg: "#f5eaff", accent: "#a78bfa", glow: "#a78bfa55",
      light: false, caption: "Cosmic purple"
    },
    {
      name: "Nebula", icon: "✨", scene: "☁️",
      bg: "linear-gradient(110deg,#f9a8d4,#db2777,#581c87)",
      fg: "#fff0fa", accent: "#f9a8d4", glow: "#f472b655",
      light: false, caption: "Pink star clouds"
    }
  ],
  [
    {
      name: "Storm", icon: "🌩️", scene: "🌩️",
      bg: "linear-gradient(110deg,#172033,#334e68,#1e293b)",
      fg: "#eff6ff", accent: "#93c5fd", glow: "#93c5fd40",
      light: false, caption: "Stormy skies"
    },
    {
      name: "Clear", icon: "🌤️", scene: "🌤️",
      bg: "linear-gradient(110deg,#dff7ff,#7dd3fc,#38bdf8)",
      fg: "#123e67", accent: "#bae6fd", glow: "#38bdf855",
      light: true, caption: "Clear blue sky"
    }
  ],
  [
    {
      name: "Beach", icon: "🌴", scene: "🏝️",
      bg: "linear-gradient(110deg,#ffe7a3,#fbbf24,#0e7490)",
      fg: "#633919", accent: "#fb923c", glow: "#fbbf2445",
      light: true, caption: "Golden coast"
    },
    {
      name: "Snow", icon: "❄️", scene: "🏔️",
      bg: "linear-gradient(110deg,#effaff,#bfdbfe,#93c5fd)",
      fg: "#153b69", accent: "#60a5fa", glow: "#60a5fa45",
      light: true, caption: "Snowy escape"
    }
  ],
  [
    {
      name: "Space", icon: "🪐", scene: "🪐",
      bg: "linear-gradient(110deg,#10072c,#32105e,#080e34)",
      fg: "#f3e8ff", accent: "#c084fc", glow: "#a855f755",
      light: false, caption: "Deep universe"
    },
    {
      name: "Earth", icon: "🌍", scene: "🌍",
      bg: "linear-gradient(110deg,#042f2e,#047857,#064e3b)",
      fg: "#ecfdf5", accent: "#34d399", glow: "#34d39945",
      light: false, caption: "Our living world"
    }
  ]
];

/* =========================================
   BUILD THE NAVBARS
========================================= */

const gallery = document.getElementById("navGallery");

themePairs.forEach((pair, pairIndex) => {
  pair.forEach((theme, sideIndex) => {
    const nav = document.createElement("nav");

    nav.className = "theme-nav";
    nav.dataset.pair = pairIndex;
    nav.dataset.side = sideIndex;
    nav.dataset.light = String(theme.light);

    nav.setAttribute(
      "aria-label",
      theme.name + " themed navigation"
    );

    nav.innerHTML = `
      <div class="environment-layer environment-a"></div>
      <div class="environment-layer environment-b"></div>
      <div class="environment-atmosphere"></div>

      <div class="scene">
        <span class="scene-icon"></span>
      </div>

      <div class="theme-info">
        <span class="theme-label"></span>
        <span class="theme-caption"></span>
      </div>

      <div class="nav-links">
        <a href="#home" class="nav-link active">Home</a>
        <a href="#login" class="nav-link">Login</a>
        <a href="#signup" class="nav-link">Signup</a>
        <a href="#contact" class="nav-link">Contact</a>
      </div>

      <button type="button"
        class="theme-switch"
        aria-pressed="false"
        aria-label="Switch theme">

        <span class="switch-icon left-icon"></span>
        <span class="switch-icon right-icon"></span>
        <span class="switch-knob"></span>
      </button>
    `;

    const links = nav.querySelectorAll(".nav-link");

    links.forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();

        links.forEach(item => item.classList.remove("active"));
        link.classList.add("active");
      });
    });

    nav.querySelector(".theme-switch").addEventListener("click", () => {
      const currentSide = Number(nav.dataset.side);
      const nextSide = currentSide === 0 ? 1 : 0;

      setTheme(nav, pair[nextSide], nextSide, true);
    });

    gallery.appendChild(nav);

    // First render has no transition.
    setTheme(nav, theme, sideIndex, false);
  });
});

/* =========================================
   APPLY THEME + ENVIRONMENTAL TRANSITION
========================================= */

function setTheme(nav, theme, side, animate = true) {
  const pair = themePairs[Number(nav.dataset.pair)];
  const toggle = nav.querySelector(".theme-switch");

  const layerA = nav.querySelector(".environment-a");
  const layerB = nav.querySelector(".environment-b");

  const isInitialized = nav.dataset.initialized === "true";

  // Update the target theme's foreground and accents.
  nav.dataset.side = side;
  nav.dataset.light = String(theme.light);

  nav.style.setProperty("--fg", theme.fg);
  nav.style.setProperty("--accent", theme.accent);
  nav.style.setProperty("--glow", theme.glow);

  if (!isInitialized) {
    // Initial theme: set the visible background directly.
    layerA.style.background = theme.bg;
    layerB.style.background = theme.bg;

    layerA.classList.add("visible");
    layerB.classList.remove("visible");

    nav.dataset.activeLayer = "a";
    nav.dataset.initialized = "true";
  } else if (animate) {
    const activeLayer =
      nav.dataset.activeLayer === "a" ? layerA : layerB;

    const incomingLayer =
      nav.dataset.activeLayer === "a" ? layerB : layerA;

    // Prepare the incoming theme on the hidden layer.
    incomingLayer.style.background = theme.bg;
    incomingLayer.classList.remove("visible");

    // Restart the atmosphere animation on repeated clicks.
    nav.classList.remove("changing");

    if (nav._transitionTimer) {
      clearTimeout(nav._transitionTimer);
    }

    // Force the browser to register the reset.
    void nav.offsetWidth;

    nav.classList.add("changing");

    // Crossfade old and new environments.
    requestAnimationFrame(() => {
      incomingLayer.classList.add("visible");
      activeLayer.classList.remove("visible");
    });

    nav.dataset.activeLayer =
      incomingLayer === layerA ? "a" : "b";

    // Remove the sunset overlay after 4.5 seconds.
    nav._transitionTimer = setTimeout(() => {
      nav.classList.remove("changing");
      nav._transitionTimer = null;
    }, 4500);
  }

  // Update landscape and theme title.
  nav.querySelector(".scene-icon").textContent = theme.scene;
  nav.querySelector(".theme-label").textContent = theme.name;
  nav.querySelector(".theme-caption").textContent = theme.caption;

  // Update both toggle icons.
  toggle.dataset.side = side === 0 ? "left" : "right";

  toggle.querySelector(".left-icon").textContent = pair[0].icon;
  toggle.querySelector(".right-icon").textContent = pair[1].icon;

  toggle.setAttribute("aria-pressed", String(side === 1));

  toggle.setAttribute(
    "aria-label",
    `Switch ${theme.name} to ${
      pair[side === 0 ? 1 : 0].name
    }`
  );

  // Move the knob and update its icon.
  const knob = toggle.querySelector(".switch-knob");

  knob.textContent = theme.icon;
  knob.style.color = theme.accent;
  knob.style.borderColor = theme.accent;
}

/* =========================================
   END
========================================= */
</script>

</body>
</html>
